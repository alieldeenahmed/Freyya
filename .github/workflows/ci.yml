name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  storefront:
    name: Storefront (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      # The route types (such as LayoutProps) are generated by Next, so make them first.
      - run: npx next typegen
      - run: npm run typecheck
      # Logic and component tests. No browser or database needed.
      - run: npm test
      # With no API reachable the build uses the bundled catalog, which is what we want here.
      # The server-only settings are given recognisable fake values, so the next step can prove
      # that none of them ends up in a file a browser downloads.
      - run: npm run build
        env:
          API_URL: http://sentinel-api.example:4999
          DATABASE_URL: postgresql://sentinel:sentinelpass@sentinel-db.example/freyya
          ADMIN_EMAIL: sentinel-admin@example.com
          ADMIN_PASSWORD_HASH: scrypt$0123456789abcdef$0123456789abcdef0123456789abcdef
          CRON_SECRET: sentinel-cron-secret-0123456789
          PROXY_SECRET: sentinel-proxy-secret-0123456789
          DATABASE_URL_UNPOOLED: postgresql://sentinel:sentinelpass@sentinel-db-direct.example/freyya
      - run: npm run check:bundle
        env:
          API_URL: http://sentinel-api.example:4999
          DATABASE_URL: postgresql://sentinel:sentinelpass@sentinel-db.example/freyya
          ADMIN_EMAIL: sentinel-admin@example.com
          ADMIN_PASSWORD_HASH: scrypt$0123456789abcdef$0123456789abcdef0123456789abcdef
          CRON_SECRET: sentinel-cron-secret-0123456789
          PROXY_SECRET: sentinel-proxy-secret-0123456789
          DATABASE_URL_UNPOOLED: postgresql://sentinel:sentinelpass@sentinel-db-direct.example/freyya
      # Fails if a page's JavaScript has grown past its budget in perf-budget.json.
      - run: npm run perf

  api:
    name: API (types, build, tests on Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: freyya
          POSTGRES_PASSWORD: freyya
          POSTGRES_DB: freyya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freyya -d freyya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://freyya:freyya@localhost:5432/freyya_test
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # The storefront's copy of the catalog and shop rules is generated from the API's own files.
      # This fails if it is out of date, and says which command brings it up to date.
      - run: npm run sync:data:check
      # Create the tables in the empty database. The tests would refuse to run if
      # DATABASE_URL matched TEST_DATABASE_URL, so it is set for this step only.
      - run: npm run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      # Includes the checks that the storefront and the API still agree on prices and the catalog.
      - run: npm test

  e2e:
    name: End-to-end (Playwright and accessibility scans)
    # Slow, so only once the quick checks pass.
    needs: [storefront, api]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: freyya
          POSTGRES_PASSWORD: freyya
          POSTGRES_DB: freyya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U freyya -d freyya_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://freyya:freyya@localhost:5432/freyya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            Frontend/package-lock.json
            Backend/package-lock.json
      - name: Install both packages
        run: |
          npm --prefix Backend ci
          npm --prefix Frontend ci
      - name: Create the tables
        run: npm --prefix Backend run db:migrate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
        working-directory: Frontend
      - name: Build the storefront against the test API's address
        run: npm run build
        working-directory: Frontend
        env:
          API_URL: http://localhost:4010
      # Playwright starts the API and the storefront itself (see Frontend/playwright.config.ts).
      - name: Run the end-to-end tests
        run: npx playwright test
        working-directory: Frontend
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7
