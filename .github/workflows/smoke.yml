name: Smoke test the live demo

# A short, read-only check of the deployed site: the storefront answers, its products come from
# the API and not the fallback snapshot, checkout and the admin sign-in page load, and the demo
# admin can sign in. It places no orders and changes nothing.
#
# Runs when Vercel reports a successful production deployment, and by hand.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Address to test
        default: https://freyya.vercel.app
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{ github.repository == 'alieldeenahmed/Freyya' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.deployment_status.state == 'success' &&
            github.event.deployment.environment == 'Production')) }}
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the smoke tests
        env:
          LIVE_URL: ${{ inputs.url || 'https://freyya.vercel.app' }}
          DEMO_ADMIN_EMAIL: ${{ secrets.DEMO_ADMIN_EMAIL }}
          DEMO_ADMIN_PASSWORD: ${{ secrets.DEMO_ADMIN_PASSWORD }}
        run: npx playwright test --config playwright.live.config.ts
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7
