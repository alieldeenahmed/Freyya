name: Smoke test the live demo

# A short, read-only check of the deployed site: the storefront answers, its products come from
# the API and not the fallback snapshot, checkout and the admin sign-in page load, and the demo
# admin can sign in. It places no orders and changes no data.
#
# It needs no repository secret. The demo login is published in the README on purpose, so the
# job reads it from there instead of keeping a second copy.
#
# Runs when Vercel reports a successful production deployment of the storefront, and by hand.
# A deployment that only changes the API does not rebuild the storefront, so it does not run this.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Address to test
        default: https://freyya.vercel.app
        required: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{ github.repository == 'alieldeenahmed/Freyya' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.deployment_status.state == 'success' &&
            startsWith(github.event.deployment.environment, 'Production'))) }}
    defaults:
      run:
        working-directory: Frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Wait for the live site to answer
        env:
          LIVE_URL: ${{ inputs.url || 'https://freyya.vercel.app' }}
        run: |
          if ! curl --fail --silent --show-error --output /dev/null \
            --retry 6 --retry-delay 10 --retry-all-errors --max-time 30 \
            "$LIVE_URL/api/health"; then
            echo "::error::The live site did not answer $LIVE_URL/api/health. Is the demo down?"
            exit 1
          fi
      - name: Read the demo login the README publishes
        working-directory: .
        run: |
          email=$(sed -n 's/^| Email | `\(.*\)` |$/\1/p' README.md)
          password=$(sed -n 's/^| Password | `\(.*\)` |$/\1/p' README.md)
          if [ -z "$email" ] || [ -z "$password" ]; then
            echo "::error::Could not find the demo login table in README.md"
            exit 1
          fi
          echo "::add-mask::$password"
          echo "DEMO_ADMIN_EMAIL=$email" >> "$GITHUB_ENV"
          echo "DEMO_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
      - name: Run the smoke tests
        env:
          LIVE_URL: ${{ inputs.url || 'https://freyya.vercel.app' }}
        run: npx playwright test --config playwright.live.config.ts
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            Frontend/playwright-report
            Frontend/test-results
          retention-days: 7
